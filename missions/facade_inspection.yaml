# Facade inspection of a rectangular building.
#
# The bread-and-butter job for an inspection multirotor: fly the four sides of a
# structure at a fixed standoff, holding the camera on the wall. Yaw is driven
# by the point of interest rather than by the direction of travel, so the
# aircraft crabs sideways down each face with the camera pointed inward — which
# is where the reference stops being a straight line the vehicle can lazily
# follow and starts demanding coordinated lateral acceleration.
#
# Coordinates are a disused site in east London chosen at random; nothing here
# corresponds to a real inspection job.

name: facade_inspection
description: >
  Four-sided facade survey at 12 m standoff, camera held on the structure
  throughout. Moderate speed, rounded corners, feasible reference.

origin:
  latitude: 51.5074
  longitude: -0.1278
  altitude: 12.0

defaults:
  cruise_speed: 4.0
  acceptance_radius: 1.5
  yaw_mode: poi
  max_tangential_acceleration: 2.5
  max_lateral_acceleration: 3.0
  max_climb_rate: 2.5
  max_descent_rate: 1.5
  corner_mode: round
  corner_radius: 5.0

geofence:
  # A 160 m square centred on the origin, comfortably outside the survey.
  polygon_ned:
    - [-80.0, -80.0]
    - [-80.0, 80.0]
    - [80.0, 80.0]
    - [80.0, -80.0]
  min_altitude: 3.0
  max_altitude: 60.0
  warning_margin: 6.0
  action: rtl

failsafe:
  low_battery_remaining: 0.25
  critical_battery_remaining: 0.12
  link_loss_timeout_s: 3.0
  link_loss_critical_s: 15.0
  gnss_loss_timeout_s: 2.0
  rtl_altitude: 35.0
  low_battery_action: rtl
  critical_battery_action: land
  link_loss_action: hold
  link_loss_critical_action: rtl
  gnss_loss_action: land
  geofence_action: rtl

items:
  - type: takeoff
    altitude: 18.0
    label: climb to survey height

  # The four faces, at 25 m from the structure centre.
  - type: waypoint
    north: 25.0
    east: -25.0
    altitude: 18.0
    label: north-west corner
  - type: waypoint
    north: 25.0
    east: 25.0
    altitude: 18.0
    label: north-east corner
  - type: waypoint
    north: -25.0
    east: 25.0
    altitude: 24.0
    label: south-east corner, upper band
  - type: waypoint
    north: -25.0
    east: -25.0
    altitude: 24.0
    label: south-west corner, upper band
  - type: waypoint
    north: 25.0
    east: -25.0
    altitude: 24.0
    hold_s: 3.0
    label: close the loop and hold for a still

  # Orbit the structure once at close range, camera inward. This is where the
  # reference is continuously curved rather than piecewise straight.
  - type: orbit
    north: 0.0
    east: 0.0
    altitude: 20.0
    radius: 18.0
    sweep_deg: 360.0
    clockwise: true
    label: close orbit

  - type: rtl
  - type: land
