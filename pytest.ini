[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra shows a summary of everything that was not a plain pass, including skips,
# which is how the optional pyulog cross-check makes itself visible rather than
# silently not running.
addopts = -ra --strict-markers --durations=10

filterwarnings =
    error::DeprecationWarning:mission_control.*
    ignore::DeprecationWarning
