# `docker compose up` runs the whole pipeline and verifies the artifacts.
#
# The SITL services are behind profiles so they are not built unless asked
# for: the reference comparison does not need them.

services:
  # The default. Tests, comparison, figures, RESULTS.md, verification.
  bench:
    build: .
    image: mission-control:latest
    volumes:
      - ./results:/app/results
      - ./analysis/figures:/app/analysis/figures
      - ./docs:/app/docs
    command: ["bash", "scripts/run_all.sh"]

  # A one-minute version: one seed, nominal speed, calm air.
  quick:
    build: .
    image: mission-control:latest
    volumes:
      - ./results:/app/results
      - ./analysis/figures:/app/analysis/figures
      - ./docs:/app/docs
    command: ["bash", "scripts/run_all.sh", "--quick", "--skip-tests"]

  # Just the comparison, no tests and no documents.
  comparison:
    build: .
    image: mission-control:latest
    volumes:
      - ./results:/app/results
    command: ["python", "analysis/run_comparison.py"]

  # Just the test suite.
  test:
    build: .
    image: mission-control:latest
    command: ["python", "-m", "pytest", "-q"]

  # Re-tune both controllers on the training scenarios and rewrite
  # config/tuned_gains.yaml.
  tune:
    build: .
    image: mission-control:latest
    volumes:
      - ./config:/app/config
    command: ["python", "scripts/tune_gains.py"]

  # --- PX4 SITL, behind profiles --------------------------------------------
  # The campaign itself is scripts/run_sitl_campaign.py, which starts a fresh
  # PX4 per flight; these services are for flying one mission by hand.
  #
  #   docker compose --profile sitl up -d px4
  #   docker compose --profile sitl run --rm sitl-mission
  #   docker compose --profile sitl down
  #
  # PX4 v1.17.0 with its SIH physics, headless. network_mode none gives it a
  # loopback interface and nothing else, so MAVLink's fixed UDP ports cannot
  # meet another simulator on the same Docker host.
  px4:
    profiles: ["sitl"]
    build:
      context: ./sitl/sih
    image: mission-control-px4-sih:latest
    network_mode: none
    environment:
      # Home at facade_inspection's declared origin.
      - PX4_HOME_LAT=51.5074
      - PX4_HOME_LON=-0.1278
      - PX4_HOME_ALT=12.0

  # Flies a mission through the mission-control stack against PX4. Shares the
  # PX4 container's network namespace: PX4's onboard MAVLink link sends to
  # 127.0.0.1:14540, which is where the flight script's link relay listens.
  sitl-mission:
    profiles: ["sitl"]
    build:
      context: .
      target: sitl
    image: mission-control-sitl:latest
    depends_on:
      - px4
    network_mode: "service:px4"
    command: ["python", "scripts/run_px4_sitl.py", "--mission", "facade_inspection",
              "--tracker", "mpc", "--output", "/tmp/flight"]

  # PX4 v1.15 with Gazebo, for watching a flight rather than measuring one.
  # Not used by the campaign or CI. gz-transport is pinned to loopback and its
  # own partition so it cannot discover other Gazebo instances on the host.
  #
  #   docker compose --profile gazebo up -d px4-gazebo
  #   docker compose --profile gazebo run --rm sitl-mission-gazebo
  px4-gazebo:
    profiles: ["gazebo"]
    build:
      context: ./sitl
      dockerfile: gazebo.Dockerfile
    image: mission-control-px4-gazebo:latest
    network_mode: none
    environment:
      - PX4_SIM_MODEL=gz_x500
      - HEADLESS=1
      - GZ_PARTITION=px4mc
      - GZ_IP=127.0.0.1

  sitl-mission-gazebo:
    profiles: ["gazebo"]
    build:
      context: .
      target: sitl
    image: mission-control-sitl:latest
    depends_on:
      - px4-gazebo
    network_mode: "service:px4-gazebo"
    command: ["python", "scripts/run_px4_sitl.py", "--mission", "facade_inspection",
              "--tracker", "mpc", "--airframe", "gz_x500", "--output", "/tmp/flight"]
